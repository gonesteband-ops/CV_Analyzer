services:
  app:
    build: .
    container_name: cv-analyzer
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/analizer.db
    volumes:
      - uploads_data:/app/src/uploads
      - db_data:/app/data
    restart: unless-stopped

volumes:
  uploads_data:
  db_data:
